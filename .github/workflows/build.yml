name: Build IPA

on: [push]

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build
        run: |
          cordova create AudioApp com.offline.player OfflinePlayer
          cp index.html AudioApp/www/index.html
          cd AudioApp
          cordova platform add ios
          cordova build ios --emulator --nobuild

      - name: Compile App with xcodebuild
        run: |
          cd AudioApp/platforms/ios
          xcodebuild -workspace OfflinePlayer.xcworkspace -scheme OfflinePlayer -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r AudioApp/platforms/ios/build/emulator/OfflinePlayer.app Payload/ || cp -r ~/Library/Developer/Xcode/DerivedData/OfflinePlayer-*/Build/Products/Debug-iphonesimulator/OfflinePlayer.app Payload/
          zip -r OfflinePlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePlayer-IPA
          path: OfflinePlayer.ipa
