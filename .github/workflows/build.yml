name: Build IPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build
        run: |
          cordova create AudioApp com.offline.player OfflinePlayer
          cp index.html AudioApp/www/index.html
          cd AudioApp
          cordova platform add ios
          cordova build ios --emulator

      - name: Package to IPA
        run: |
          mkdir Payload
          cp -r AudioApp/platforms/ios/build/emulator/OfflinePlayer.app Payload/
          zip -r OfflinePlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePlayer-IPA
          path: OfflinePlayer.ipa
